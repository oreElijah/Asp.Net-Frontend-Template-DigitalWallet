services:
  web:
    build:
      context: .
      dockerfile: DigitalWallet/Dockerfile

    volumes:
      - .:/src

    ports:
      - "5071:5071"

    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - POSTGRES_HOST=db
      - POSTGRES_DB=DigitalWalletDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Twizzycool01$
      - Redis__Configuration="redis:6379"
      - Redis__InstanceName="DigitalWalletApi"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=DigitalWalletDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Twizzycool01$

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: DigitalWallet-redis

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  seq:
    image: datalust/seq:latest

    ports:
      - "5341:5341"

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"

    volumes:
      - seq_data:/data
volumes:
  postgres_data:
  redis_data:
  seq_data: